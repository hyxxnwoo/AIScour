# =====================================================
# 개발 환경 오버라이드
# - frontend 는 Vite dev server (HMR) 로 실행
# - 모든 포트를 호스트로 노출
# - 데이터베이스 포트 노출하여 로컬 GUI 접속 가능
# 사용 예:
#   cp .env.development.example .env.development
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.development up
# =====================================================
services:
  frontend:
    # 개발 환경에서는 Nginx 정적 빌드 대신 Node 컨테이너에서 Vite dev server 실행
    image: node:20-alpine
    working_dir: /app
    entrypoint: ['sh', '-c']
    command: ['npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0']
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend

  backend:
    environment:
      NODE_ENV: development
    ports:
      - '8000:8000'

  database:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'
