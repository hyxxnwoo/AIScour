<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI SCOUR 파일럿 디지털트윈 — 1차년도 화면 10종 v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============ 서체 (사용자 PC 설치 폰트 참조) ============ */
@font-face{font-family:'FS';font-weight:300;src:local('Freesentation 3 Light'),local('Freesentation3Light');}
@font-face{font-family:'FS';font-weight:400;src:local('Freesentation 4 Regular'),local('Freesentation4Regular');}
@font-face{font-family:'FS';font-weight:500;src:local('Freesentation 5 Medium'),local('Freesentation5Medium');}
@font-face{font-family:'FS';font-weight:600;src:local('Freesentation 6 SemiBold'),local('Freesentation6SemiBold');}
@font-face{font-family:'FS';font-weight:700;src:local('Freesentation 7 Bold'),local('Freesentation7Bold');}
@font-face{font-family:'FS';font-weight:800;src:local('Freesentation 8 ExtraBold'),local('Freesentation8ExtraBold');}
@font-face{font-family:'FS';font-weight:900;src:local('Freesentation 9 Black'),local('Freesentation9Black');}
@font-face{font-family:'FS';font-weight:200;src:local('Freesentation 2 ExtraLight'),local('Freesentation2ExtraLight');}

:root{
  --bg:#0B1C2E; --panel:#13293F; --panel2:#17324F; --gnb:#0A1B2B; --well:#0E2235;
  --line:#24415F; --line2:#1B3350;
  --ink:#E6EEF6; --ink2:#9FB6C8; --ink3:#6B8299;
  --mint:#00D4B0; --teal:#2A9FC4;
  --a1:#2E7DD1; --a2:#E8B21A; --a3:#E8791A; --a4:#D02B2B; --ok:#2EA36B;
  --font:'FS','Pretendard','Malgun Gothic','맑은 고딕',system-ui,-apple-system,sans-serif;
  --nav-h:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#06121E;color:var(--ink);font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ============ 상단 개발용 네비 (캡처 시 숨김) ============ */
#nav{height:var(--nav-h);display:flex;align-items:center;gap:2px;background:#071320;border-bottom:1px solid #16304A;padding:0 10px;position:relative;z-index:50}
#nav .brand{font-weight:800;font-size:12px;color:var(--mint);letter-spacing:.3px;margin-right:12px;white-space:nowrap}
#nav .tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
#nav .tabs::-webkit-scrollbar{display:none}
#nav button.t{background:transparent;border:1px solid transparent;color:var(--ink3);font-family:var(--font);font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
#nav button.t:hover{color:var(--ink2);background:#0E2032}
#nav button.t.on{background:#123A52;color:#fff;border-color:#1D5878}
#nav button.t .n{font-weight:700;font-size:10px;color:var(--mint);opacity:.85}
#nav .cap{background:#123A52;border:1px solid #1D5878;color:#CFE6F2;font-family:var(--font);font-size:11px;font-weight:600;padding:6px 11px;border-radius:5px;cursor:pointer;white-space:nowrap;margin-left:8px}
#nav .cap:hover{background:#17506F}
body.capture #nav{display:none}
body.capture .scr-badge{display:none}

#stage{height:calc(100vh - var(--nav-h));position:relative;background:var(--bg)}
body.capture #stage{height:100vh}
.screen{display:none;height:100%;position:relative}
.screen.on{display:block}

.scr-badge{position:absolute;right:10px;bottom:30px;z-index:40;display:flex;gap:6px;align-items:center;background:rgba(7,19,32,.82);border:1px solid #1C3952;border-radius:5px;padding:4px 8px;font-size:10px;color:var(--ink3)}
.scr-badge b{color:var(--mint);font-weight:700;letter-spacing:.3px}
.scr-badge .st{padding:1px 6px;border-radius:3px;font-weight:600;font-size:9.5px}
.st.impl{background:#10402F;color:#5BD6A0}
.st.mod{background:#3D2A0C;color:#E8B21A}
.st.plan{background:#102C45;color:#6FB6DE}

/* ============ 앱 셸 ============ */
.app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.gnb{height:46px;flex:0 0 46px;background:var(--gnb);border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:0 14px;gap:20px}
.gnb .logo{font-weight:800;font-size:14px;color:#fff;letter-spacing:.4px}
.gnb .logo i{color:var(--mint);font-style:normal}
.gnb nav{display:flex;gap:4px;flex:1}
.gnb nav a{font-size:12.5px;font-weight:500;color:#8CA6BD;padding:7px 13px;border-radius:5px;text-decoration:none;cursor:pointer}
.gnb nav a:hover{color:#CFE0EC}
.gnb nav a.on{color:#fff;background:#17364F;font-weight:600}
.gnb .right{display:flex;align-items:center;gap:14px;font-size:11.5px;color:#8CA6BD}
.gnb .sel{background:#102A42;border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:11.5px;color:#CFE0EC;font-weight:500}
.gnb .alertdot{display:flex;align-items:center;gap:5px;font-weight:600}
.gnb .alertdot .d{width:8px;height:8px;border-radius:50%}
.subnav{height:34px;flex:0 0 34px;background:#0C2134;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:2px;padding:0 12px}
.subnav .lbl{font-size:10.5px;color:#4E6F8C;margin-right:8px;font-weight:700;letter-spacing:.3px}
.subnav a{font-size:11.5px;font-weight:500;color:#7E9BB5;padding:5px 11px;border-radius:4px;cursor:pointer}
.subnav a:hover{color:#CFE0EC}
.subnav a.on{background:#123A52;color:#fff;font-weight:600}
.subnav a .k{font-size:9.5px;color:var(--mint);margin-right:4px;font-weight:700}

.body3{flex:1;display:flex;min-height:0}
.lp,.rp{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.lp{flex:0 0 252px;border-right:1px solid var(--line2)}
.rp{flex:0 0 300px;border-left:1px solid var(--line2)}
.lp::-webkit-scrollbar,.rp::-webkit-scrollbar{width:7px}
.lp::-webkit-scrollbar-thumb,.rp::-webkit-scrollbar-thumb{background:#1E3A57;border-radius:4px}
.center{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.sbar{height:26px;flex:0 0 26px;background:#081726;border-top:1px solid var(--line2);display:flex;align-items:center;padding:0 12px;gap:14px;font-size:10.5px;color:var(--ink3)}
.sbar b{color:#9FC4DC;font-weight:600}
.sbar .sp{color:#1F3B55}

.grp{border-bottom:1px solid var(--line2)}
.grp>h3{font-size:11px;font-weight:700;color:var(--mint);letter-spacing:.3px;padding:9px 13px 7px;background:#102339;display:flex;align-items:center;justify-content:space-between}
.grp>h3 .tag{font-size:9px;font-weight:600;color:var(--ink3);letter-spacing:0}
.grp .in{padding:10px 13px 13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.row label{font-size:11.5px;color:#BCD0E0}
.row .v{font-size:11.5px;font-weight:600;color:#fff}
.chk{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:11.5px;color:#BCD0E0;cursor:pointer}
.chk:last-child{margin-bottom:0}
.box{width:13px;height:13px;border-radius:3px;border:1.5px solid #3A5B7C;flex:0 0 13px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#06121E;font-weight:800}
.chk.on .box{background:var(--mint);border-color:var(--mint)}
.chk.on{color:#fff;font-weight:500}
.chk.dis{opacity:.55;cursor:default}
.chk.dis.on .box{background:#4E6F8C;border-color:#4E6F8C}
.rad{width:12px;height:12px;border-radius:50%;border:1.5px solid #3A5B7C;flex:0 0 12px;position:relative}
.chk.on .rad{border-color:var(--mint)}
.chk.on .rad::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:var(--mint)}
.inp{background:var(--well);border:1px solid var(--line);border-radius:4px;color:#fff;font-family:var(--font);font-size:11.5px;font-weight:500;padding:4px 8px;width:68px;text-align:right}
.inp.ro{background:transparent;border-color:transparent;color:#9FC4DC}
.unit{font-size:10px;color:var(--ink3);width:26px}
.sld{height:3px;background:#1E3A57;border-radius:2px;position:relative;margin:7px 0 2px}
.sld i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:2px}
.sld b{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--mint);transform:translateX(-50%);box-shadow:0 0 0 3px rgba(0,212,176,.18)}
.seg{display:flex;gap:4px}
.seg span{flex:1;text-align:center;font-size:11px;font-weight:500;padding:5px 0;border-radius:4px;border:1px solid var(--line);color:#A8C0D4;background:var(--well);cursor:pointer;white-space:nowrap}
.seg span.on{background:var(--teal);border-color:var(--teal);color:#06121E;font-weight:700}
.btn{display:block;width:100%;text-align:center;background:var(--teal);color:#06121E;border:none;font-family:var(--font);font-size:12px;font-weight:700;padding:8px;border-radius:5px;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;border:1px solid var(--teal);color:var(--teal)}
.btn.sm{font-size:11px;padding:6px}
.btn.dis{background:#2B3A47;color:#7E8C99;cursor:not-allowed}
.hint{font-size:10px;color:var(--ink3);line-height:1.5;margin-top:6px;white-space:normal}
.lnk{color:var(--teal);font-weight:600;cursor:pointer}
.lnk:hover{text-decoration:underline}
.tag-ro{font-size:9px;font-weight:700;color:#E8B21A;background:#3D2A0C;padding:1px 6px;border-radius:3px}
.prov{font-size:9px;font-weight:700;color:#6FB6DE;background:#102C45;padding:1px 6px;border-radius:3px;white-space:nowrap}
.drop{border:1.5px dashed #2E5273;border-radius:6px;padding:12px 10px;text-align:center;font-size:11px;color:#7E9BB5;line-height:1.6;background:#0E2235;cursor:pointer}
.drop:hover{border-color:var(--teal)}

/* 3D 뷰포트 */
.vp{flex:1;position:relative;min-height:0;background:#0A1D30;overflow:hidden}
.vp canvas{display:block;width:100%;height:100%}
.vp canvas.pick{cursor:crosshair}
.vptool{position:absolute;left:12px;top:12px;z-index:5;display:flex;gap:4px;align-items:center;background:rgba(8,22,36,.88);border:1px solid #1E3C58;border-radius:6px;padding:4px}
.vptool span{font-size:11px;font-weight:500;color:#A8C0D4;padding:4px 9px;border-radius:4px;cursor:pointer}
.vptool span.on{background:#19476A;color:#fff;font-weight:600}
.vptool .div{width:1px;height:16px;background:#23455F;margin:0 3px}
.vptool .tg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#A8C0D4;padding:4px 8px}
.flowmark{position:absolute;left:14px;bottom:12px;z-index:5;font-size:11px;font-weight:600;color:#7FD4E8;background:rgba(8,22,36,.7);padding:4px 10px;border-radius:4px}
.fps{position:absolute;right:14px;bottom:12px;z-index:5;font-size:10.5px;color:#5E7F9A;font-weight:500}

/* 타임라인 */
.tl{flex:0 0 auto;background:#0C2034;border-top:1px solid var(--line2)}
.tlbar{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px}
.tlbar .pl{display:flex;gap:9px;align-items:center;color:#BCD0E0;font-size:13px}
.tlbar .pl b{cursor:pointer;font-weight:400;user-select:none}
.tlbar .pl b:hover{color:#fff}
.tlbar .pl .main{font-size:15px;color:var(--mint)}
.track{flex:1;height:4px;background:#1A3350;border-radius:3px;position:relative;cursor:pointer}
.track::before{content:'';position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:3px;pointer-events:none}
.track b{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--mint);transform:translateX(-50%);box-shadow:0 0 0 4px rgba(0,212,176,.16);pointer-events:none}
.tlbar .t{font-size:11px;color:#9FB6C8;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.tlbar select{background:var(--well);border:1px solid var(--line);border-radius:4px;color:#CFE0EC;font-family:var(--font);font-size:11px;padding:3px 5px}

/* 카드 · 표 · 기타 */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:12px;margin:11px 13px}
.kv{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink2);margin-bottom:4px;gap:8px}
.kv b{color:#fff;font-weight:600;font-size:11.5px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
.pill.a1{background:var(--a1)}.pill.a2{background:var(--a2);color:#3D2A00}.pill.a3{background:var(--a3)}.pill.a4{background:var(--a4)}
.legend-bar{display:flex;height:11px;border-radius:3px;overflow:hidden}
.legend-bar div{flex:1}
.legend-sc{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink3);margin-top:3px}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{background:#102339;color:#9FC4DC;font-weight:600;font-size:10.5px;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line2);color:#CFDCE7}
table.t tr:hover td{background:#152E46}
table.t tr.sel td{background:#12374D}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c{text-align:center}
.h2{font-size:12.5px;font-weight:700;color:#fff}
.sub{font-size:11px;color:var(--ink3)}
.mono{font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.mid{font-size:19px;font-weight:800;line-height:1.1}
.tabs2{display:flex;gap:3px;padding:10px 14px 0}
.tabs2 span{font-size:12px;font-weight:600;padding:7px 15px;border-radius:6px 6px 0 0;cursor:pointer;color:#8CA6BD;background:#0E2235;border:1px solid var(--line2);border-bottom:none}
.tabs2 span.on{background:var(--panel);color:#fff;border-color:var(--line)}
.stchip{display:flex;align-items:center;gap:6px;background:#0E2235;border:1px solid var(--line2);border-radius:6px;padding:6px 11px;font-size:11px;color:#9FB6C8;cursor:pointer}
.stchip b{font-size:14px;font-weight:800}
.stchip.on{border-color:var(--teal)}
.sbadge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#1E3A57;display:inline-block}

/* 교각 모니터 */
.pm{margin-bottom:12px}
.pm-wrap{position:relative;padding:3px 0}
.pm-track{position:relative;height:12px;border-radius:6px;background:#15293D;overflow:hidden}
.pm-zone{position:absolute;top:0;bottom:0;opacity:.2}
.pm-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.pm-tick{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.55)}
.pm-knob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.3)}
.pm-scale{position:relative;height:13px;font-size:9.5px;color:var(--ink3);margin-top:-4px}
.pm-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#123A52;border:1px solid #1D5878;color:#E6EEF6;font-size:12px;padding:9px 16px;border-radius:6px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="nav">
  <div class="brand">AI SCOUR · 1차년도 화면 10종 v2</div>
  <div class="tabs" id="tabs"></div>
  <button class="cap" id="capBtn">화면 캡처 (PNG 저장)</button>
</div>
<div id="stage"></div>
<div class="toast" id="toast"></div>
<script>
/* ======================================================================
   1. 기준값 · 등급 로직
   ----------------------------------------------------------------------
   계획서 p.43·59: 경보 4단계(관심·주의·경계·심각)는 신뢰성 지수 β 또는
   세굴 여유고의 잔여 비율로 구분. 구간 수치는 3차년도(F-1-③) 확정 예정.
   → 아래 GRADES.min 값은 '잠정'. 확정 시 이 부분만 수정하면 전 화면에 반영됨.
   ====================================================================== */
const FD = 5.2;   // 기초 근입깊이 (m)
const GRADES = [
  { k:'a1', name:'관심', en:'Blue',   min:70, act:'정상 모니터링 유지' },
  { k:'a2', name:'주의', en:'Yellow', min:40, act:'점검 주기 단축' },
  { k:'a3', name:'경계', en:'Orange', min:20, act:'현장 긴급 점검 실시' },
  { k:'a4', name:'심각', en:'Red',    min:-1e9, act:'통행 제한 및 긴급 보강 검토' },
];
const GCOL = { a1:'#2E7DD1', a2:'#E8B21A', a3:'#E8791A', a4:'#D02B2B' };
const remainPct  = d => Math.max(0, (FD - d) / FD * 100);
const gradeOf    = d => GRADES.find(g => remainPct(d) >= g.min);
const gradeIdx   = g => GRADES.indexOf(g);
const depthAtPct = pct => FD * (1 - pct / 100);           // 70→1.56, 40→3.12, 20→4.16
const TH_DEPTH   = [depthAtPct(70), depthAtPct(40), depthAtPct(20)];

/* 교각 기본 3개 */
const PIERS = [
  { id:'P1', x:-7.2, z:0, dmax:1.85 },
  { id:'P2', x: 0.0, z:0, dmax:3.42 },
  { id:'P3', x: 7.2, z:0, dmax:2.10 },
];
const PC = { P1:'#7FD4E8', P2:'#C792EA', P3:'#9FE07A' };   // 시계열 계열색 (등급색과 구분)
const DOM = { x0:-15, x1:15, z0:-9.5, z1:9.5, nx:76, nz:50 };
const TMAX = 1780, NFRAME = 60, VEXG = 1.5;

function growth(t){ return 1 - Math.exp(-t/300); }
function pierDepth(p, t){ return p.dmax * growth(t); }
function reachTime(p, D){ return D < p.dmax ? -300 * Math.log(1 - D / p.dmax) : null; }
function worstPier(t){ return PIERS.reduce((a,b)=> pierDepth(b,t) > pierDepth(a,t) ? b : a); }
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const fmt = (v,n=2)=>Number(v).toFixed(n);

/* scrdif(x,z,t): 음(−) 세굴 / 양(+) 퇴적 */
function scrdifAt(x, z, t){
  const g = growth(t); let v = 0;
  for (const p of PIERS){
    const dx=(x-p.x)/3.15, dz=(z-p.z)/2.55;
    v -= p.dmax*g*Math.exp(-(dx*dx+dz*dz)*1.15);
    const bx=(x-p.x-5.4)/3.2, bz=(z-p.z)/2.3;
    v += 0.24*p.dmax*g*Math.exp(-(bx*bx+bz*bz));
  }
  v += 0.11*Math.sin(x*0.42+1.3)*Math.cos(z*0.55-0.4);
  return v;
}
function cellVel(x,z){ let m=1e9; for(const p of PIERS) m=Math.min(m,Math.hypot(x-p.x,z-p.z)); return 0.85+1.0*Math.exp(-(m*m)/4); }

/* ======================================================================
   2. 상태
   ====================================================================== */
const ST = {
  t: TMAX, playing:false, speed:1, sec:'A',
  cell: { x:DOM.x0+41*(30/76), z:DOM.z0+22*(19/50), i:41, j:22 },
  alertClosed:false,
  sop: [
    { g:'a1', t:'정상 모니터링 유지', done:true,  when:'10-02 09:22', who:'시스템' },

const SAND=[200,190,158];
const PRESETS = {
  iso  :{ yaw:34, pitch:31, dist:41, tgt:[0,-1.4,0], fov:1.40 },
  top  :{ yaw:0.5, pitch:88.4, dist:62, tgt:[0,-1.0,0], fov:3.95 },
  side :{ yaw:90, pitch:9, dist:42, tgt:[0,-1.0,0], fov:1.45 },
  flow :{ yaw:2, pitch:16, dist:38, tgt:[0,-1.0,0], fov:1.45 },
  closeup:{ yaw:44, pitch:29, dist:30, tgt:[0.4,-1.8,0], fov:1.5 },

function camBasis(c){
  const ry=c.yaw*Math.PI/180, rp=c.pitch*Math.PI/180;
  const cp=Math.cos(rp), sp=Math.sin(rp), cy=Math.cos(ry), sy=Math.sin(ry);
  const eye=[c.tgt[0]+c.dist*cp*sy, c.tgt[1]+c.dist*sp, c.tgt[2]+c.dist*cp*cy];
  const f=[c.tgt[0]-eye[0], c.tgt[1]-eye[1], c.tgt[2]-eye[2]];
  const fl=Math.hypot(...f); f[0]/=fl; f[1]/=fl; f[2]/=fl;
  let r=[-f[2],0,f[0]]; const rl=Math.hypot(...r)||1; r=[r[0]/rl,0,r[2]/rl];
  const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return {eye,f,r,u};
}
function makeProj(c, W, H){
  const b=camBasis(c), s=Math.min(W,H)*c.fov;
  return p=>{
    const d=[p[0]-b.eye[0], p[1]-b.eye[1], p[2]-b.eye[2]];
    const zc=d[0]*b.f[0]+d[1]*b.f[1]+d[2]*b.f[2]; if (zc<0.4) return null;
    const xc=d[0]*b.r[0]+d[1]*b.r[1]+d[2]*b.r[2];
    const yc=d[0]*b.u[0]+d[1]*b.u[1]+d[2]*b.u[2];
    return [W/2 + xc*s/zc, H/2 - yc*s/zc, zc];
  };
}
const LIGHT=(()=>{const v=[-0.42,0.84,0.34];const l=Math.hypot(...v);return v.map(a=>a/l);})();

function pickCell(cv, e){

  let best=null, bd=24*24;
  for(let i=0;i<=nx;i++) for(let j=0;j<=nz;j++){
    const x=x0+i*dx, z=z0+j*dz;
    if (PIERS.some(p=>Math.hypot(x-p.x,z-p.z)<0.9)) continue;
    const v=proj([x, scrdifAt(x,z,ST.t)*VEXG, z]); if(!v) continue;
    const d=(v[0]-mx)**2+(v[1]-my)**2; if(d<bd){ bd=d; best={x,z,i,j}; }
  }

}

function sectionSamples(t, sec, n=160){
  const out=[], L=secLen(sec);
  for(let i=0;i<=n;i++){ const s=L*i/n;
    out.push({s, v: sec==='A' ? scrdifAt(DOM.x0+s,0,t) : scrdifAt(0,DOM.z0+s,t)}); }

  s+=`<line x1="${cx}" y1="${T}" x2="${cx}" y2="${T+ih}" stroke="#00D4B0" stroke-width="1.5"/>`;
  for(const p of PIERS){ const d=pierDepth(p,t), cy=Y(d);

       `<text x="${cx-9}" y="${cy-7}" fill="${PC[p.id]}" font-size="11.5" font-weight="700" text-anchor="end" font-family="FS, Pretendard, Malgun Gothic, sans-serif">${p.id} ${fmt(d)}</text>`; }
  return `<svg ${svgEl(W,H)}>${s}</svg>`;
}
/* 셀 시계열 미니 차트 */
function cellMini(cell, t){
  const W=300,H=96,L=30,R=6,T=8,B=14, iw=W-L-R, ih=H-T-B;
  const vals=[]; for(let i=0;i<=44;i++) vals.push(scrdifAt(cell.x,cell.z,TMAX*i/44));
  const mn=Math.min(...vals,-0.2), mx=Math.max(...vals,0.2), Y=v=>T+ih*(1-(v-mn)/(mx-mn));
  const p=vals.map((v,i)=>[L+iw*i/44, Y(v)]), cx=L+iw*(t/TMAX), cv=scrdifAt(cell.x,cell.z,t);
  return `<svg ${svgEl(W,H)}>
    <line x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}" stroke="#4E6F8C" stroke-dasharray="4 3"/>
    <text x="${L-4}" y="${Y(mx)+4}" fill="#6B8299" font-size="9" text-anchor="end" font-family="FS, Pretendard, Malgun Gothic, sans-serif">${fmt(mx,1)}</text>
    <text x="${L-4}" y="${Y(0)+3}" fill="#6B8299" font-size="9" text-anchor="end" font-family="FS, Pretendard, Malgun Gothic, sans-serif">0</text>
    <text x="${L-4}" y="${Y(mn)}" fill="#6B8299" font-size="9" text-anchor="end" font-family="FS, Pretendard, Malgun Gothic, sans-serif">${fmt(mn,1)}</text>
    <text x="${L}" y="${H-2}" fill="#6B8299" font-size="9" font-family="FS, Pretendard, Malgun Gothic, sans-serif">0 s</text>
    <text x="${W-R}" y="${H-2}" fill="#6B8299" font-size="9" text-anchor="end" font-family="FS, Pretendard, Malgun Gothic, sans-serif">${TMAX} s</text>
    <path d="${pathFrom(p)}" fill="none" stroke="${GCOL.a3}" stroke-width="2"/>
    <line x1="${cx}" y1="${T}" x2="${cx}" y2="${T+ih}" stroke="#00D4B0" stroke-width="1.2"/>
    <circle cx="${cx}" cy="${Y(cv)}" r="3.5" fill="#00D4B0"/></svg>`;
}

        ${GRADES.map((g,i)=>`<div style="border:1px solid ${g.k===g2.k?GCOL[g.k]:'var(--line2)'};background:${g.k===g2.k?GCOL[g.k]+'1F':'#0E2235'};border-radius:6px;padding:9px 10px;margin-bottom:7px">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><span class="pill ${g.k}">${g.name}</span><span class="sub">${g.en}</span>
            <span class="mono" style="margin-left:auto;font-size:10px;color:#8CA6BD">${['≥ 70 %','40 – 70 %','20 – 40 %','< 20 %'][i]}</span></div>
          <div style="font-size:11.5px;color:#fff;font-weight:600">${g.act}</div></div>`).join('')}
        <div class="hint">경계·심각 판정 시 현장 긴급 점검·통행 제한·임시 보강이 즉시 이루어지도록 경보 체계와 연동 (계획서 p.43). 여유율 구간은 <span class="prov">잠정</span></div>
      </div>
    </div>${sbar()}
    ${badge('DT-200','경보 · SOP 대응','plan')}</div>`;
}

/* ======================================================================
   7. 부트스트랩 · 이벤트
   ====================================================================== */
const SCREENS=[
  ['1','로그인',S1],['2','케이스 관리',S2],['3','데이터 연동',S3],['4','조건 설정',S4],
  ['5','3D 세굴 가시화',S5],['6','평면뷰 · 단면',S6],['7','셀 상세',S7],
  ['8','타임라인 · 시계열',S8],['9','위험 판정',S9],['10','경보 · SOP',S10],
];
const stage=document.getElementById('stage'), tabsEl=document.getElementById('tabs');
SCREENS.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='screen'; d.id='sc'+i; stage.appendChild(d);
  const b=document.createElement('button'); b.className='t'; b.innerHTML=`<span class="n">${s[0]}</span>${s[1]}`;
  b.onclick=()=>show(i); tabsEl.appendChild(b);
});
let cur=-1;
function show(i){
  cur=i;
  document.querySelectorAll('.screen').forEach((e,k)=>{ e.classList.toggle('on',k===i); if(k!==i) e.innerHTML=''; });
  document.querySelectorAll('#tabs .t').forEach((e,k)=>e.classList.toggle('on',k===i));
  render(i);
}
function render(i){
  const el=document.getElementById('sc'+i); if(!el) return;
  el.innerHTML=SCREENS[i][2](); draw(i);
}
function rerender(){ if(cur>=0) render(cur); }
function draw(i){
  const root=document.getElementById('sc'+i); if(!root) return;
  root.querySelectorAll('canvas.v3d').forEach(cv=>{
    let o={}; try{ o=JSON.parse(cv.dataset.opt||'{}'); }catch(e){}
    o.preset=cv.dataset.preset||'iso'; o.t=ST.t;
    if (o.useSec) o.sec=ST.sec;
    if (o.useCell && ST.cell) o.cell=ST.cell;
    const res=renderScene(cv,o); cv._proj=res&&res.proj;
    if (cv.dataset.pick) cv.onclick=e=>pickCell(cv,e);
  });
  const ph=root.querySelector('#prof-host'); if(ph) ph.innerHTML=profChart(ST.t, ST.sec);
  const th=root.querySelector('#ts-host'); if(th) th.innerHTML=tsChart(ST.t);
}

/* 타임라인 재생 */
let timer=null;
function setPlaying(on){
  ST.playing=on; clearInterval(timer);
  if (on){
    if (ST.t>=TMAX) ST.t=0;
    timer=setInterval(()=>{
      ST.t=Math.min(TMAX, ST.t+30*ST.speed);
      if (ST.t>=TMAX){ ST.playing=false; clearInterval(timer); }
      rerender();
    },120);
  }
  rerender();
}
function setT(t){ ST.t=Math.max(0,Math.min(TMAX,t)); rerender(); }

let toastTimer=null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),2200); }

document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if (act==='goto') show(+a.dataset.to);
  else if (act==='toast') toast(a.dataset.msg);
  else if (act==='tl-play') setPlaying(!ST.playing);
  else if (act==='tl-start') { setPlaying(false); setT(0); }
  else if (act==='tl-end') { setPlaying(false); setT(TMAX); }
  else if (act==='tl-back') setT(ST.t-30);
  else if (act==='tl-fwd') setT(ST.t+30);
  else if (act==='tl-seek'){ const r=a.getBoundingClientRect(); setT(Math.round((e.clientX-r.left)/r.width*TMAX/30)*30); }
  else if (act==='sec') { ST.sec=a.dataset.v; rerender(); }
  else if (act==='cell-close') { ST.cell=null; rerender(); }
  else if (act==='sop'){
    const s=ST.sop[+a.dataset.i]; s.done=!s.done;
    if (s.done){ s.when=nowStr(); s.who='admin'; }
    ST.hist.unshift([nowStr(),'admin',`${s.t} — ${s.done?'완료 처리':'완료 취소'}`]);
    rerender();
  }
  else if (act==='alert-close'){ ST.alertClosed=true; ST.hist.unshift([nowStr(),'admin','SOP 전 항목 완료 — 경보 종료']); rerender(); }
});
document.addEventListener('change', e=>{ if (e.target.matches('select[data-speed]')) ST.speed=+e.target.value; });

/* 화면 캡처 → PNG 저장 */
function capName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const nm=SCREENS[cur][1].replace(/[\s·]+/g,'');
  return `SCDT_${p(+SCREENS[cur][0])}_${nm}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.png`;
}
async function capture(){
  if (typeof html2canvas==='undefined'){ toast('캡처 라이브러리를 불러오지 못했습니다 (인터넷 연결 확인)'); return; }
  if (ST.playing) setPlaying(false);
  document.body.classList.add('capture'); rerender();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  let name=capName();
  try{
    const c=await html2canvas(stage,{backgroundColor:'#0B1C2E',scale:Math.min(2,window.devicePixelRatio||1),logging:false});
    const a=document.createElement('a'); a.download=name; a.href=c.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
  }catch(err){ name=null; toast('캡처 실패: '+err.message); }
  document.body.classList.remove('capture'); rerender();
  if (name) toast('저장됨 · '+name);
}
document.getElementById('capBtn').onclick=capture;

let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(rerender,140); });
document.addEventListener('keydown',e=>{
  if (e.target.tagName==='SELECT') return;
  if (e.key==='ArrowRight') show(Math.min(SCREENS.length-1,cur+1));
  if (e.key==='ArrowLeft') show(Math.max(0,cur-1));
  if (e.key===' ') { e.preventDefault(); setPlaying(!ST.playing); }
});
show(0);
</script>
