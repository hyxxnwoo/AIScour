<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FLOW-3D 시뮬레이션 데이터를 시각화하는 교량 세굴 3D 대시보드" />
    <title>Bridge Scour 3D Dashboard</title>
  </head>
  <body>
    <div id="app">
      <div id="gnb"></div>
      <div id="subnav"></div>
      <main id="screen-root" class="screen-root">
        <section id="viewer-stage" class="viewer-stage">
          <aside id="dock-left" class="ui-dock ui-dock--left" aria-label="설정 패널"></aside>
          <div id="viewer-center" class="viewer-center">
            <div id="viewer-main" class="viewer-main">
              <canvas id="scene-canvas"></canvas>
            </div>
          </div>
          <aside id="dock-right" class="ui-dock ui-dock--right" aria-label="분석 패널"></aside>
        </section>
        <div id="screen-placeholder-host" class="screen-placeholder-host"></div>
      </main>
      <div id="sbar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
