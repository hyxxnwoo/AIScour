upstream backend_api {
    # docker-compose 의 서비스명으로 해석된다.
    server backend:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =====================================================
    # 보안 헤더
    # =====================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP 는 Three.js 가 데이터 URI/Blob 을 사용할 수 있으므로 프로젝트 진행에 따라 점진 강화한다.

    # =====================================================
    # 헬스체크: Docker HEALTHCHECK 와 외부 LB 모두에서 사용한다.
    # =====================================================
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # =====================================================
    # 정적 자원 캐싱 (해시 기반 파일명 → 1년 immutable)
    # =====================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|wasm|glb|gltf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # =====================================================
    # 백엔드 API 프록시
    # =====================================================
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_pass http://backend_api;
    }

    # =====================================================
    # SPA 라우팅: 모든 비매칭 요청을 index.html 로 폴백
    # =====================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 숨김 파일 차단
    location ~ /\. {
        deny all;
    }
}
